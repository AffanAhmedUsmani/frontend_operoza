<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Discovered and fetched in parallel with the rest of the page,
         unlike the CSS @import this replaces (see styles.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
    />
    <!--
      Deliberately just "Operoza" (not a full marketing tagline): this
      is the CRM's own browser-tab title (TenantLoginPage.jsx,
      TenantPortalPage.jsx, etc. render no SeoHead - they're excluded
      from robots.txt/sitemap.xml and don't need per-route SEO), and the
      pre-JS instant's title for public pages before SeoHead mounts.
      react-helmet-async doesn't recognize or remove tags it didn't
      render itself, so scripts/prerender.mjs strips this exact tag from
      its captured output for the public routes it prerenders - it would
      otherwise sit duplicated alongside each page's real SeoHead title.
    -->
    <title>Operoza</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
